name: MEHLISSA Next CI

on:
  push:
    branches:
      - main
      - mehlissa-next-generation
  pull_request:

permissions:
  contents: read

env:
  VCPKG_COMMIT: ddd0023b0eee70986e42ed49d9d4afb8098f212e
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install publication validation tools
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
      - name: Check documentation consistency
        run: |
          python scripts/check_documentation_consistency.py
          python scripts/check_evidence_validity_matrix.py
          python scripts/check_paper1_protocol.py
          python scripts/check_pulmonary_capillary_qualification_protocol.py
          python scripts/check_pulmonary_capillary_evidence_candidates.py
          python scripts/check_pulmonary_capillary_preoutcome_amendment.py
          python scripts/check_pulmonary_capillary_data_ingress.py
          python scripts/check_paper1_release_candidate.py
          python -m unittest tests/test_evidence_validity_matrix.py
          python -m unittest tests/test_paper1_protocol.py
          python -m unittest tests/test_pulmonary_capillary_qualification_protocol.py
          python -m unittest tests/test_pulmonary_capillary_evidence_candidates.py
          python -m unittest tests/test_pulmonary_capillary_preoutcome_amendment.py
          python -m unittest tests/test_pulmonary_capillary_data_ingress.py
          python -m unittest tests/test_paper1_measurement_tools.py
          python -m unittest tests/test_paper1_release_candidate.py

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Python packaging tools
        run: python -m pip install --disable-pip-version-check --no-input "setuptools>=77" wheel
      - name: Install pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout "$env:VCPKG_COMMIT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc-debug
      - name: Test
        run: ctest --preset windows-msvc-debug

  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Python packaging tools
        run: python -m pip install --disable-pip-version-check --no-input "setuptools>=77" wheel
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Install pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Test
        run: ctest --preset linux-gcc-debug

  macos-apple-clang:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Python packaging tools
        run: python -m pip install --disable-pip-version-check --no-input "setuptools>=77" wheel
      - name: Record Apple toolchain
        run: |
          uname -a
          clang++ --version
          cmake --version
          ninja --version
      - name: Install pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset macos-apple-clang
      - name: Build
        run: cmake --build --preset macos-apple-clang-debug
      - name: Test
        run: ctest --preset macos-apple-clang-debug

  linux-clang-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare Python packaging tools
        run: python -m pip install --disable-pip-version-check --no-input "setuptools>=77" wheel
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install --yes clang clang-format clang-tidy ninja-build
      - name: Verify formatting
        run: >-
          find apps core experiment models tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
          xargs -0 clang-format --dry-run --Werror
      - name: Install pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset linux-clang-analysis
      - name: Build with clang-tidy and sanitizers
        run: cmake --build --preset linux-clang-analysis
      - name: Test with sanitizers
        run: ctest --preset linux-clang-analysis
