[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mehlissa-research"
version = "1.0.0"
description = "Process API, result-analysis helpers, and local workbench for MEHLISSA Next"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "MEHLISSA contributors"}]
dependencies = []

[project.scripts]
mehlissa-workbench = "mehlissa_workbench.__main__:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
publication = ["jsonschema==4.25.1"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
mehlissa_workbench = ["static/*.html", "static/*.css", "static/*.js"]
